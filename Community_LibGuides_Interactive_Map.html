php?g=971690","category":"C","pages":4,"human":""},{"key":"guides.emich.edu|g=1493451","title":"Urban Studies","url":"https://guides.emich.edu/c.php?g=1493451","category":"C","pages":1,"human":""}]}]}];
const topicLabel = "Geographic Information Systems";
const modeLabel = "Quick Map (Automated)";
const omittedLabel = "111 unplaced sites";
const selected = {category: new Set(["A", "B", "C"]), priority: new Set(["Low", "Medium", "High"])};
const institutionSearchEnabled = true;
const institutionSearchLimit = 10;
const institutionFocusZoom = 8;
const institutionPulseEnabled = true;
const layer = L.layerGroup().addTo(mapRef);
const markers = new Map();
const institutions = [];
for (let cityIndex=0; cityIndex < cityData.length; cityIndex++) {
  const city = cityData[cityIndex];
  for (const site of city.sites) {
    institutions.push({
      cityIndex, host:site.host, name:site.institution,
      normalized:site.institution.toLocaleLowerCase(),
      locality: [city.city,city.region,city.country].filter(Boolean).join(', ')
    });
  }
}
institutions.sort((a,b) => a.name.localeCompare(b.name) ||
  a.locality.localeCompare(b.locality) || a.host.localeCompare(b.host));
let focusedSiteHost = null;
let focusedCityIndex = -1;
let focusRing = null;
let pulseRing = null;
let pulseFrame = null;
let pendingMoveEnd = null;
let navigationToken = 0;
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeHref = url => /^https?:\/\//i.test(String(url ?? '')) ? escapeHtml(url) : '';
const classNames = {A:'Guide Title Match',B:'Page Title Match',C:'Search Result Match Only'};
const panel = L.control({position:'topright'});
let controls;

function selection(city) {
  let shown = [];
  for (const site of city.sites) {
    if (!selected.priority.has(site.priority)) continue;
    const guides = site.guides.filter(g => selected.category.has(g.category));
    if (guides.length) shown.push({site, guides});
  }
  return shown;
}

function popup(city, included, focusedHost = null) {
  const allGuides = new Set();
  let pages = 0;
  for (const {guides} of included) for (const guide of guides) {
    allGuides.add(guide.key); pages += guide.pages;
  }
  let out = `<div class="clgm-popup"><h3>${escapeHtml(city.city)}${city.region ? ', '+escapeHtml(city.region) : ''}, ${escapeHtml(city.country)}</h3>`;
  out += `<div class="clgm-summary">${included.length} site${included.length!==1?'s':''} · ${allGuides.size} distinct guide${allGuides.size!==1?'s':''} · ${pages} collected page${pages!==1?'s':''}</div>`;
  for (const {site,guides} of included) {
    const ror = safeHref(site.ror_url);
    out += `<div class="clgm-site${focusedHost === site.host ? ' clgm-site-target' : ''}"><h4>${escapeHtml(site.institution)}</h4>`;
    out += `<div class="clgm-site-info">${escapeHtml(site.ror_name || '')}`;
    if (ror) out += ` · <a href="${ror}" target="_blank" rel="noopener noreferrer">ROR</a>`;
    out += ` · <span class="clgm-pill clgm-pill-${site.priority}">${escapeHtml(site.priority)} geographic review priority</span>`;
    if (site.verified) out += ` · Human-reviewed location`;
    out += `</div><ul>`;
    for (const guide of guides) {
      const url = safeHref(guide.url);
      out += `<li><span class="clgm-pill clgm-pill-${guide.category}">${guide.category}</span> `;
      out += url ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(guide.title)}</a>` : escapeHtml(guide.title);
      out += ` <span style="color:#68766b">(${guide.pages} page${guide.pages!==1?'s':''})</span>`;
      if (guide.human === 'Relevant') out += ` <strong>(reviewed relevant)</strong>`;
      out += `</li>`;
    }
    out += `</ul></div>`;
  }
  out += `</div>`;
  return out;
}

const defaultMarkerStyle = {
  color:'#154734', weight:1.5, opacity:.97, fillColor:'#2a8064', fillOpacity:.75
};
const focusedMarkerStyle = {
  color:'#e2a316', weight:4, opacity:1, fillColor:'#154734', fillOpacity:1
};

function stopPulse() {
  if (pulseFrame !== null) { cancelAnimationFrame(pulseFrame); pulseFrame = null; }
  if (pulseRing && layer.hasLayer(pulseRing)) layer.removeLayer(pulseRing);
  pulseRing = null;
}

function syncFocusPanel() {
  if (!controls || !institutionSearchEnabled) return;
  const box = controls.querySelector('[data-focused]');
  if (!box) return;
  const current = institutions.find(i => i.cityIndex === focusedCityIndex && i.host === focusedSiteHost);
  box.hidden = !current;
  if (current) {
    box.querySelector('[data-focused-name]').textContent = current.name;
    box.querySelector('[data-focused-locality]').textContent = current.locality;
  }
}

function clearInstitutionFocus(message = '') {
  navigationToken++;
  if (pendingMoveEnd) { mapRef.off('moveend',pendingMoveEnd); pendingMoveEnd = null; }
  stopPulse();
  if (focusRing && layer.hasLayer(focusRing)) layer.removeLayer(focusRing);
  focusRing = null;
  focusedSiteHost = null;
  focusedCityIndex = -1;
  if (controls && institutionSearchEnabled) {
    controls.querySelector('[data-institution-search]').value = '';
    controls.querySelector('[data-search-results]').replaceChildren();
    controls.querySelector('[data-search-feedback]').textContent = message;
  }
  refresh();
}

function refresh() {
  // A prior selection may disappear when either research filter changes.
  if (focusedSiteHost && !selection(cityData[focusedCityIndex]).some(
      ({site}) => site.host === focusedSiteHost)) {
    navigationToken++;
    if (pendingMoveEnd) { mapRef.off('moveend',pendingMoveEnd); pendingMoveEnd = null; }
    stopPulse();
    if (focusRing && layer.hasLayer(focusRing)) layer.removeLayer(focusRing);
    focusRing = null;
    focusedSiteHost = null;
    focusedCityIndex = -1;
    if (controls && institutionSearchEnabled) {
      controls.querySelector('[data-search-feedback]').textContent =
        'The previously selected institution is now hidden by the research filters.';
    }
  }
  let visibleCities = 0, visibleSites = 0, pages = 0;
  const globalGuides = new Set();
  const bounds = [];
  for (let i=0; i<cityData.length; i++) {
    const city = cityData[i];
    const included = selection(city);
    let marker = markers.get(i);
    if (!included.length) {
      if (marker && layer.hasLayer(marker)) layer.removeLayer(marker);
      continue;
    }
    visibleCities++;
    visibleSites += included.length;
    const localGuides = new Set();
    for (const {guides} of included) for (const guide of guides) {
      pages += guide.pages;
      globalGuides.add(guide.key);
      localGuides.add(guide.key);
    }
    bounds.push([city.lat, city.lon]);
    const radius = Math.max(5, Math.min(20, 4.5 + 2 * Math.sqrt(localGuides.size)));
    if (!marker) {
      marker = L.circleMarker([city.lat,city.lon], {
        radius, ...defaultMarkerStyle
      });
      marker.bindPopup('', {maxWidth:550, minWidth:260, maxHeight:420, autoPan:true});
      markers.set(i,marker);
    }
    const isFocused = focusedCityIndex === i && focusedSiteHost !== null;
    marker.setRadius(radius + (isFocused ? 3 : 0));
    marker.setStyle(isFocused ? focusedMarkerStyle : defaultMarkerStyle);
    marker.setPopupContent(popup(city,included,isFocused ? focusedSiteHost : null));
    if (!layer.hasLayer(marker)) layer.addLayer(marker);
    if (isFocused) marker.bringToFront();
  }
  const txt = controls.querySelector('[data-total]');
  txt.textContent = `${visibleCities} cities · ${visibleSites} sites · ${globalGuides.size} guides · ${pages} pages`;
  controls.querySelector('[data-empty]').style.display = visibleCities ? 'none':'block';
  mapRef._clgmVisibleBounds = bounds;
  // The independent focus ring is attached to the selected city's location,
  // never a second institution marker or a separately geocoded position.
  if (focusedCityIndex !== -1) {
    const city = cityData[focusedCityIndex];
    const marker = markers.get(focusedCityIndex);
    if (marker && layer.hasLayer(marker)) {
      if (!focusRing) focusRing = L.circleMarker([city.lat,city.lon], {
        radius: marker.getRadius() + 10, color:'#e2a316', weight:3,
        opacity:.95, fill:false, interactive:false, dashArray:'5 4'
      });
      focusRing.setLatLng([city.lat,city.lon]);
      focusRing.setRadius(marker.getRadius() + 10);
      if (!layer.hasLayer(focusRing)) layer.addLayer(focusRing);
      marker.bringToFront();
    }
  } else if (focusRing && layer.hasLayer(focusRing)) {
    layer.removeLayer(focusRing);
    focusRing = null;
  }
  syncFocusPanel();
  if (institutionSearchEnabled && controls) updateInstitutionResults(false);
}

function pulseCity(cityIndex) {
  stopPulse();
  if (!institutionPulseEnabled || focusedCityIndex !== cityIndex) return;
  const city = cityData[cityIndex];
  const marker = markers.get(cityIndex);
  if (!marker || !layer.hasLayer(marker)) return;
  const initialRadius = marker.getRadius() + 7;
  pulseRing = L.circleMarker([city.lat,city.lon], {
    radius: initialRadius, color:'#f2b11f', weight:3,
    opacity:.9, fill:false, interactive:false
  });
  layer.addLayer(pulseRing);
  const start = performance.now();
  const duration = 1550;
  function animate(now) {
    if (!pulseRing || focusedCityIndex !== cityIndex) { stopPulse(); return; }
    const fraction = Math.min(1,(now-start)/duration);
    pulseRing.setRadius(initialRadius + 33 * fraction);
    pulseRing.setStyle({opacity:.9 * (1-fraction), weight:3 - 1.5*fraction});
    if (fraction < 1) pulseFrame = requestAnimationFrame(animate);
    else stopPulse();
  }
  pulseFrame = requestAnimationFrame(animate);
}

function scrollSelectedInstitution(marker) {
  const popupElement = marker.getPopup() && marker.getPopup().getElement();
  if (!popupElement) return;
  const area = popupElement.querySelector('.leaflet-popup-content');
  const target = popupElement.querySelector('.clgm-site-target');
  if (!area || !target) return;
  requestAnimationFrame(() => {
    const a = area.getBoundingClientRect();
    const t = target.getBoundingClientRect();
    area.scrollTop += t.top - a.top - 12;
  });
}

function institutionVisible(candidate) {
  return selection(cityData[candidate.cityIndex]).some(({site}) => site.host === candidate.host);
}

function goToInstitution(candidate) {
  const feedback = controls.querySelector('[data-search-feedback]');
  if (!institutionVisible(candidate)) {
    feedback.textContent = 'This institution is hidden by the selected guide/geographic filters. Change the filters to show it.';
    return;
  }
  const city = cityData[candidate.cityIndex];
  const marker = markers.get(candidate.cityIndex);
  if (!marker || !layer.hasLayer(marker)) {
    feedback.textContent = 'The matching institution is not currently displayed.';
    return;
  }
  // Stop an earlier flight/selection; only the newest result may open a popup.
  navigationToken++;
  const token = navigationToken;
  if (pendingMoveEnd) { mapRef.off('moveend',pendingMoveEnd); pendingMoveEnd = null; }
  stopPulse();
  mapRef.stop();
  focusedSiteHost = candidate.host;
  focusedCityIndex = candidate.cityIndex;
  refresh();  // Set gold style and persistent halo before navigation.
  const targetMarker = markers.get(candidate.cityIndex);
  controls.querySelector('[data-institution-search]').value = candidate.name;
  controls.querySelector('[data-search-results]').replaceChildren();
  feedback.textContent = 'Locating: ' + candidate.name + ' · ' + candidate.locality;

  const finishNavigation = () => {
    if (token !== navigationToken || focusedCityIndex !== candidate.cityIndex ||
        focusedSiteHost !== candidate.host) return;
    if (pendingMoveEnd) { mapRef.off('moveend',pendingMoveEnd); pendingMoveEnd = null; }
    // Opening AFTER the fly-to ends avoids losing the popup during zoom/move.
    targetMarker.setPopupContent(popup(city,selection(city),candidate.host));
    targetMarker.openPopup();
    scrollSelectedInstitution(targetMarker);
    pulseCity(candidate.cityIndex);
    feedback.textContent = 'Located: ' + candidate.name + ' · ' + candidate.locality;
  };
  const center = mapRef.getCenter();
  const near = Math.abs(center.lat-city.lat)<0.0001 &&
               Math.abs(center.lng-city.lon)<0.0001 &&
               mapRef.getZoom() === institutionFocusZoom;
  if (near) {
    finishNavigation();
  } else {
    pendingMoveEnd = finishNavigation;
    mapRef.once('moveend',pendingMoveEnd);
    mapRef.flyTo([city.lat,city.lon],institutionFocusZoom,{animate:true,duration:1.2});
  }
}

function updateInstitutionResults(resetFeedback = true) {
  if (!institutionSearchEnabled || !controls) return;
  const search = controls.querySelector('[data-institution-search]');
  const results = controls.querySelector('[data-search-results]');
  const feedback = controls.querySelector('[data-search-feedback]');
  if (!search || !results || !feedback) return;
  results.replaceChildren();
  if (resetFeedback) feedback.textContent = '';
  const needle = search.value.trim().toLocaleLowerCase();
  if (!needle) return;
  // Search the institution display name only, never guide names or ROR aliases.
  const matching = institutions.filter(entry => entry.normalized.includes(needle));
  matching.sort((a,b) =>
    Number(institutionVisible(b)) - Number(institutionVisible(a)) ||
    Number(b.normalized.startsWith(needle)) - Number(a.normalized.startsWith(needle)) ||
    a.name.localeCompare(b.name) || a.locality.localeCompare(b.locality));
  for (const candidate of matching.slice(0,institutionSearchLimit)) {
    const option = document.createElement('button');
    option.type = 'button';
    option.className = 'clgm-search-result';
    const title = document.createElement('span');
    title.textContent = candidate.name;
    const place = document.createElement('span');
    place.className = 'clgm-search-place';
    place.textContent = candidate.locality + (institutionVisible(candidate) ? '' : ' · hidden by filters');
    option.append(title,place);
    option.addEventListener('click', () => goToInstitution(candidate));
    results.appendChild(option);
  }
  if (!matching.length) feedback.textContent = 'No institution names match this search.';
  else if (matching.length > institutionSearchLimit)
    feedback.textContent = `Showing the first ${institutionSearchLimit} of ${matching.length} matches. Type more to narrow.`;
}

panel.onAdd = function() {
  const div = L.DomUtil.create('div','clgm-control');
  div.setAttribute('role','region');
  div.setAttribute('aria-label','Research map filters');
  div.innerHTML = `
    <div class="clgm-head"><h2 data-topic></h2><div class="clgm-sub" data-mode></div></div>
    <div class="clgm-pad">
      ${institutionSearchEnabled ? `<div class="clgm-group" style="border-top:none;margin-top:0;padding-top:0">
        <h3>Find institution</h3>
        <input class="clgm-search" type="search" data-institution-search
          aria-label="Search institution names" placeholder="Type an institution name" autocomplete="off">
        <div class="clgm-search-results" data-search-results aria-label="Institution search results"></div>
        <p class="clgm-search-feedback" data-search-feedback aria-live="polite"></p>
        <div class="clgm-focused" data-focused hidden>
          <strong data-focused-name></strong>
          <span data-focused-locality></span>
          <div><button type="button" data-clear-focus>Clear map highlight</button></div>
        </div>
        <p class="clgm-note">Searches institution names in this map only. Selecting a result zooms to and highlights its city.</p>
      </div>` : ''}
      <div class="clgm-group"><h3>Guide title evidence</h3>
        <label class="clgm-option"><input type="checkbox" data-kind="category" value="A"><span class="clgm-pill clgm-pill-A">A</span> Guide Title Match</label>
        <label class="clgm-option"><input type="checkbox" data-kind="category" value="B"><span class="clgm-pill clgm-pill-B">B</span> Page Title Match</label>
        <label class="clgm-option"><input type="checkbox" data-kind="category" value="C"><span class="clgm-pill clgm-pill-C">C</span> Search Result Match Only</label>
      </div>
      <div class="clgm-group"><h3>Geographic review priority</h3>
        <label class="clgm-option"><input type="checkbox" data-kind="priority" value="Low"><span class="clgm-pill clgm-pill-Low">Low</span> Strong automatic evidence</label>
        <label class="clgm-option"><input type="checkbox" data-kind="priority" value="Medium"><span class="clgm-pill clgm-pill-Medium">Medium</span> Provisional match</label>
        <label class="clgm-option"><input type="checkbox" data-kind="priority" value="High"><span class="clgm-pill clgm-pill-High">High</span> Review recommended</label>
      </div>
      <div class="clgm-group"><h3>Current filtered results</h3>
        <div class="clgm-count" data-total></div>
        <div data-empty class="clgm-note" style="display:none">No cities meet these filters.</div>
        <div class="clgm-buttons"><button type="button" class="clgm-btn" data-reset>Show all</button>
           <button type="button" class="clgm-btn" data-fit>Fit visible</button></div>
        <p class="clgm-note">Markers reflect visible guides. A site, and then its city, disappears when no qualifying guides remain.</p>
      </div>
    </div>
    <div class="clgm-foot">Automated categories show title evidence, not verified relevance. Geographic matches may be provisional.<div style="margin-top:5px" data-omitted></div></div>`;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  controls = div;
  div.querySelector('[data-topic]').textContent = topicLabel;
  div.querySelector('[data-mode]').textContent = modeLabel;
  div.querySelector('[data-omitted]').textContent = omittedLabel;
  if (institutionSearchEnabled) {
    div.querySelector('[data-institution-search]').addEventListener('input', () => updateInstitutionResults());
    div.querySelector('[data-clear-focus]').addEventListener('click', () => clearInstitutionFocus());
  }
  for (const input of div.querySelectorAll('input[data-kind]')) {
    input.checked = selected[input.dataset.kind].has(input.value);
    input.addEventListener('change', () => {
      if (input.checked) selected[input.dataset.kind].add(input.value);
      else selected[input.dataset.kind].delete(input.value);
      refresh();
    });
  }
  div.querySelector('[data-reset]').addEventListener('click', () => {
    selected.category = new Set(['A','B','C']);
    selected.priority = new Set(['Low','Medium','High']);
    for (const input of div.querySelectorAll('input[data-kind]')) input.checked=true;
    refresh();
  });
  div.querySelector('[data-fit]').addEventListener('click', () => {
    const bounds = mapRef._clgmVisibleBounds || [];
    if (bounds.length) mapRef.fitBounds(L.latLngBounds(bounds).pad(.13),{maxZoom:9});
  });
  return div;
};
panel.addTo(mapRef);
refresh();
if (mapRef._clgmVisibleBounds && mapRef._clgmVisibleBounds.length)
  mapRef.fitBounds(L.latLngBounds(mapRef._clgmVisibleBounds).pad(.13),{maxZoom:7});
})();
</script>
